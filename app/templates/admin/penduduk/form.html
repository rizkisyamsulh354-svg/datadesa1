{% extends "admin/base.html" %}

{% block title %}{{ action }} Data Penduduk - Admin{% endblock %}

{% block content %}
<h1 class="mt-4 mb-4">{{ action }} Data Penduduk</h1>

<div class="row">
    <div class="col-lg-8">
        <form method="POST">
            <div class="card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nik" class="form-label">NIK <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nik" name="nik" value="{{ data.nik if data else '' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="nama" class="form-label">Nama <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nama" name="nama" value="{{ data.nama if data else '' }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="tempat_lahir" class="form-label">Tempat Lahir</label>
                            <input type="text" class="form-control" id="tempat_lahir" name="tempat_lahir" value="{{ data.tempat_lahir if data else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="tanggal_lahir" class="form-label">Tanggal Lahir</label>
                            <input type="date" class="form-control" id="tanggal_lahir" name="tanggal_lahir" value="{{ data.tanggal_lahir if data else '' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="jenis_kelamin" class="form-label">Jenis Kelamin</label>
                            <select class="form-select" id="jenis_kelamin" name="jenis_kelamin">
                                <option value="">-- Pilih --</option>
                                <option value="Laki-laki" {% if data and data.jenis_kelamin == 'Laki-laki' %}selected{% endif %}>Laki-laki</option>
                                <option value="Perempuan" {% if data and data.jenis_kelamin == 'Perempuan' %}selected{% endif %}>Perempuan</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="agama" class="form-label">Agama</label>
                            <select class="form-select" id="agama" name="agama">
                                <option value="">-- Pilih --</option>
                                <option value="Islam" {% if data and data.agama == 'Islam' %}selected{% endif %}>Islam</option>
                                <option value="Kristen" {% if data and data.agama == 'Kristen' %}selected{% endif %}>Kristen</option>
                                <option value="Katolik" {% if data and data.agama == 'Katolik' %}selected{% endif %}>Katolik</option>
                                <option value="Hindu" {% if data and data.agama == 'Hindu' %}selected{% endif %}>Hindu</option>
                                <option value="Budha" {% if data and data.agama == 'Budha' %}selected{% endif %}>Budha</option>
                                <option value="Konghucu" {% if data and data.agama == 'Konghucu' %}selected{% endif %}>Konghucu</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="status_perkawinan" class="form-label">Status Perkawinan</label>
                            <select class="form-select" id="status_perkawinan" name="status_perkawinan">
                                <option value="">-- Pilih --</option>
                                <option value="Belum Kawin" {% if data and data.status_perkawinan == 'Belum Kawin' %}selected{% endif %}>Belum Kawin</option>
                                <option value="Kawin" {% if data and data.status_perkawinan == 'Kawin' %}selected{% endif %}>Kawin</option>
                                <option value="Cerai Hidup" {% if data and data.status_perkawinan == 'Cerai Hidup' %}selected{% endif %}>Cerai Hidup</option>
                                <option value="Cerai Mati" {% if data and data.status_perkawinan == 'Cerai Mati' %}selected{% endif %}>Cerai Mati</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="pendidikan" class="form-label">Pendidikan</label>
                            <input type="text" class="form-control" id="pendidikan" name="pendidikan" value="{{ data.pendidikan if data else '' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="pekerjaan" class="form-label">Pekerjaan</label>
                            <input type="text" class="form-control" id="pekerjaan" name="pekerjaan" value="{{ data.pekerjaan if data else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="dusun" class="form-label">Dusun</label>
                            <input type="text" class="form-control" id="dusun" name="dusun" value="{{ data.dusun if data else '' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="rw" class="form-label">RW</label>
                            <input type="text" class="form-control" id="rw" name="rw" value="{{ data.rw if data else '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="rt" class="form-label">RT</label>
                            <input type="text" class="form-control" id="rt" name="rt" value="{{ data.rt if data else '' }}">
                        </div>
                        <div class="col-md-4 mb-3"></div>
                    </div>

                    <div class="mb-3">
                        <label for="alamat" class="form-label">Alamat</label>
                        <textarea class="form-control" id="alamat" name="alamat" rows="3">{{ data.alamat if data else '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Simpan
                        </button>
                        <a href="{{ url_for('admin.kelola_penduduk') }}" class="btn btn-secondary">Batal</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

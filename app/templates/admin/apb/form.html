{% extends "admin/base.html" %}

{% block title %}{{ action }} Data APB - Admin{% endblock %}

{% block content %}
<h1 class="mt-4 mb-4">{{ action }} Data APB</h1>

<div class="row">
    <div class="col-lg-8">
        <form method="POST">
            <div class="card">
                <div class="card-body">
                    {% if not apb %}
                    <div class="mb-3">
                        <label for="tahun" class="form-label">Tahun <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="tahun" name="tahun" value="{{ apb.tahun if apb else '' }}" required>
                    </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="kategori" class="form-label">Kategori <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="kategori" name="kategori" value="{{ apb.kategori if apb else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="sub_kategori" class="form-label">Sub Kategori</label>
                        <input type="text" class="form-control" id="sub_kategori" name="sub_kategori" value="{{ apb.sub_kategori if apb else '' }}">
                    </div>

                    <div class="mb-3">
                        <label for="uraian" class="form-label">Uraian</label>
                        <textarea class="form-control" id="uraian" name="uraian" rows="3">{{ apb.uraian if apb else '' }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="anggaran" class="form-label">Anggaran <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="anggaran" name="anggaran" value="{{ apb.anggaran if apb else '' }}" step="0.01" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="realisasi" class="form-label">Realisasi</label>
                            <input type="number" class="form-control" id="realisasi" name="realisasi" value="{{ apb.realisasi if apb else '' }}" step="0.01">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="Anggaran" {% if apb and apb.status == 'Anggaran' %}selected{% endif %}>Anggaran</option>
                            <option value="Realisasi" {% if apb and apb.status == 'Realisasi' %}selected{% endif %}>Realisasi</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Simpan
                        </button>
                        <a href="{{ url_for('admin.kelola_apb') }}" class="btn btn-secondary">Batal</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
